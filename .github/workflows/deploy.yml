
name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/ssh-askpass.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"

          SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          DISPLAY=:0 \
          ssh-add ~/.ssh/id_deploy < /dev/null

          rm -f "$RUNNER_TEMP/ssh-askpass.sh"

      - name: Verify SSH host
        env:
          HOST: ${{ secrets.SITEGROUND_HOST }}
          PORT: ${{ secrets.SITEGROUND_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Test SiteGround connection
        env:
          HOST: ${{ secrets.SITEGROUND_HOST }}
          USER: ${{ secrets.SITEGROUND_USER }}
          PORT: ${{ secrets.SITEGROUND_PORT }}
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            'ls -la /home/customer/www; find /home/customer/www -maxdepth 3 -type d -name public_html'
